<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Løft og løp</title>
<meta name="description" content="12-ukers program for styrke, løping, qi gong og daglige rutiner, med tidtaker og logg.">
<meta name="theme-color" content="#0F1319" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F2F4F7" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Løft og løp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@600;800&display=swap">
<style>
/* Layout: smal kolonne på mobil, scene + detaljer side om side fra 900px. Mørk editorial, farge etter muskelgruppe. */
:root{
  --bg:#0F1319;--surf:#171D26;--surf2:#1F2733;--line:#2C3544;
  --fg:#ECE8E1;--mut:#A4AEBD;--acc:#F2A93B;--on-acc:#1A1204;--focus:#8CC4FF;
  --c-glute:#F2A93B;--c-quad:#5BAEF2;--c-ham:#F0735F;--c-core:#3FCBA2;--c-plyo:#AD92F5;
  --fig:#C9D1DD;--obj:#2C3544;--wt:#8A94A6;--good:#3FCBA2;
  --f-disp:'Playfair Display',Georgia,'Times New Roman',serif;
  --f-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'DM Mono',ui-monospace,'SF Mono',Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#F2F4F7;--surf:#FFFFFF;--surf2:#E8ECF2;--line:#CBD3DF;
  --fg:#131923;--mut:#4B586A;--acc:#9C5500;--on-acc:#FFFFFF;--focus:#0B5CC4;
  --c-glute:#C77800;--c-quad:#1F7CC9;--c-ham:#D2452F;--c-core:#0E9B76;--c-plyo:#7656D6;
  --fig:#3A4658;--obj:#D3DAE5;--wt:#5E6B7E;--good:#0E7A5C;color-scheme:light}}
:root[data-theme="light"]{
  --bg:#F2F4F7;--surf:#FFFFFF;--surf2:#E8ECF2;--line:#CBD3DF;
  --fg:#131923;--mut:#4B586A;--acc:#9C5500;--on-acc:#FFFFFF;--focus:#0B5CC4;
  --c-glute:#C77800;--c-quad:#1F7CC9;--c-ham:#D2452F;--c-core:#0E9B76;--c-plyo:#7656D6;
  --fig:#3A4658;--obj:#D3DAE5;--wt:#5E6B7E;--good:#0E7A5C;color-scheme:light}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:clamp(16px,.3vw + 15px,17px);line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 96px;min-height:100dvh;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--f-disp);margin:0;text-wrap:balance;line-height:1.15}
p{margin:0}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:-60px;background:var(--acc);color:var(--on-acc);padding:12px 16px;border-radius:8px;z-index:30;font-weight:700;text-decoration:none}
.skip:focus{top:calc(env(safe-area-inset-top,0px) + 8px)}
.wrap{max-width:1080px;margin:0 auto}
header.top{padding-block:18px 10px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px;justify-content:space-between}
header.top h1{font-size:clamp(1.7rem,5vw,2.4rem);font-weight:800}
.meta{font-family:var(--f-mono);font-size:.82rem;color:var(--mut);letter-spacing:.04em}
nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surf);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.bar .in{display:flex;gap:4px;width:100%;max-width:520px}
nav.bar button{flex:1;min-height:48px;background:none;border:0;border-radius:10px;color:var(--mut);font-weight:500;cursor:pointer;letter-spacing:.02em}
nav.bar button[aria-current="page"]{background:var(--surf2);color:var(--fg);box-shadow:inset 0 -3px 0 var(--acc)}
.card{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:18px}
.sec{margin-top:22px}
.sec>h2{font-size:1.3rem;margin-bottom:10px}
.kick{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.row{display:flex;flex-wrap:wrap;gap:10px}
.btn{min-height:48px;min-width:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surf2);cursor:pointer;font-weight:500}
.btn.pri{background:var(--acc);color:var(--on-acc);border-color:transparent;font-weight:700;font-size:1.05rem}
.btn.big{min-height:60px;padding:0 28px}
.btn[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:transparent}
.btn.ghost{background:none}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.pick .btn{min-height:64px;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:2px;border-left:6px solid var(--m,var(--line))}
.pick .btn small{font-family:var(--f-mono);font-size:.74rem;opacity:.85}
.hero{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.hero h2{font-size:clamp(1.5rem,4vw,2rem)}
.plan{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.plan li{display:grid;grid-template-columns:10px 1fr auto;gap:12px;align-items:center;padding:10px 12px;background:var(--surf2);border-radius:10px}
.plan i{width:10px;height:36px;border-radius:5px;background:var(--m)}
.plan b{font-weight:500}
.plan span{font-family:var(--f-mono);font-size:.85rem;color:var(--mut);text-align:right}
.stage{display:grid;gap:14px;background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:16px;border-top:6px solid var(--m)}
.fig{background:var(--surf2);border-radius:12px;display:flex;justify-content:center;padding:6px}
.fig svg{width:100%;max-width:420px;height:auto;max-height:36dvh}
.read h2{font-size:clamp(1.5rem,5vw,2.1rem)}
.cue{color:var(--mut);margin-top:4px}
.timer{font-family:var(--f-mono);font-weight:500;font-size:clamp(3.2rem,15vw,6rem);line-height:1;margin:10px 0 6px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.prog{height:8px;background:var(--surf2);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--m);transition:width .25s linear}
.dots{display:flex;gap:8px;margin:12px 0}
.dots span{width:26px;height:26px;border-radius:50%;border:2px solid var(--m)}
.dots span.on{background:var(--m)}
.dots span.cur{outline:3px solid var(--fg);outline-offset:2px}
.inputs{display:flex;flex-wrap:wrap;gap:14px;margin:10px 0}
.step{display:flex;align-items:center;gap:6px}
.step label{font-family:var(--f-mono);font-size:.75rem;color:var(--mut);display:block;letter-spacing:.06em;text-transform:uppercase}
.step input{width:84px;min-height:48px;text-align:center;font-family:var(--f-mono);font-size:1.3rem;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.step .btn{padding:0;width:48px;font-size:1.4rem}
.ctrl{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.ctrl .pri{flex:1 1 180px}
details.how{margin-top:14px;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:4px 16px}
details.how summary{min-height:48px;display:flex;align-items:center;cursor:pointer;font-weight:700}
details.how dl{margin:0 0 12px;display:grid;gap:10px}
details.how dt{font-family:var(--f-mono);font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
details.how dd{margin:2px 0 0}
.upnext{margin:0;padding-left:0;list-style:none;display:grid;gap:6px}
.upnext li{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:10px;background:var(--surf);border:1px solid var(--line);font-size:.92rem}
.upnext li i{width:8px;height:20px;border-radius:4px;background:var(--m)}
.upnext li.now{border-color:var(--m)}
.upnext li span{margin-left:auto;font-family:var(--f-mono);color:var(--mut);font-size:.8rem}
.overall{display:flex;align-items:center;gap:12px;font-family:var(--f-mono);font-size:.8rem;color:var(--mut)}
.overall .prog{flex:1}
.grid3{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.ph{border-left:6px solid var(--line)}
.ph.on{border-left-color:var(--acc);background:var(--surf2)}
.ph h3{font-size:1.15rem}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;font-size:.93rem}
th{font-family:var(--f-mono);font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);font-weight:500}
tr.today td{background:var(--surf2)}
.scroll{overflow-x:auto}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.78rem;font-family:var(--f-mono);border:1px solid var(--m,var(--line))}
ul.clean{margin:0;padding-left:1.1em;display:grid;gap:6px}
.lift{display:grid;gap:8px}
.lift .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.lift h3{font-size:1.1rem}
.big-n{font-family:var(--f-mono);font-size:1.5rem}
.note{font-size:.9rem;color:var(--mut)}
.wk{position:relative;display:flex;gap:8px;align-items:flex-end;height:130px;margin-top:16px;padding-top:6px}
.wk>div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;min-width:0}
.wk i{display:block;width:100%;max-width:44px;background:var(--m);border-radius:6px 6px 0 0;min-height:2px}
.wk em,.wk span{font-style:normal;font-family:var(--f-mono);font-size:.72rem;color:var(--mut);font-variant-numeric:tabular-nums}
.wk em{color:var(--fg)}
.wk .goal{position:absolute;left:0;right:0;border-top:2px dashed var(--line);height:0;font-weight:400}
.wk .goal span{position:absolute;right:0;top:-18px;font-family:var(--f-mono);font-size:.7rem;color:var(--mut)}
table.daily{min-width:0;width:100%}
table.daily th,table.daily td{padding:6px 1px;text-align:center}
table.daily th[scope="row"]{text-align:left;font-family:var(--f-body);font-size:.85rem;text-transform:none;letter-spacing:0;color:var(--fg);padding-right:6px;line-height:1.2}
table.daily td.tdy,table.daily th[aria-current]{background:var(--surf2)}
.dot{display:inline-flex;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);align-items:center;justify-content:center;font-size:.8rem;font-weight:700}
.dot.on{background:var(--c-core);border-color:var(--c-core);color:var(--bg)}
.mform{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-top:12px}
.field{display:flex;flex-direction:column;gap:4px;flex:1 1 130px;min-width:0}
.field label{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.field select,.field input{min-height:48px;padding:0 12px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;font:inherit;font-size:16px;width:100%}
.recent{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.recent li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:0 12px;padding:4px 0 4px 12px;border-radius:10px;background:var(--surf2)}
.recent .rd{font-family:var(--f-mono);font-size:.85rem;color:var(--mut);font-variant-numeric:tabular-nums}
.recent b{font-weight:500}
.recent .del{margin-left:auto;font-size:.9rem}
.refs{margin:0;padding-left:1.1em;display:grid;gap:8px;font-size:.88rem}
.refs a,.ilink{color:var(--acc);text-underline-offset:2px}
.ex{border-style:dashed}
.chk{display:flex;gap:12px;align-items:flex-start;min-height:48px;padding:8px 0}
.chk input{width:24px;height:24px;margin-top:2px;accent-color:var(--acc)}
.two{display:grid;gap:14px}
/* ---- Mobil: fast handlingslinje i økt, fokus aldri skjult (WCAG 2.4.11) ---- */
html{scroll-padding-bottom:calc(120px + env(safe-area-inset-bottom,0px));scroll-padding-top:12px}
button,a,summary,input,select,label{touch-action:manipulation}
body.running{padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}
body.running nav.bar{display:none}
body.running header.top h1{font-size:1.25rem}
.runtop{display:flex;align-items:center;gap:10px;margin-top:4px}
.runtop .overall{flex:1;min-width:0}
.runtop .btn{min-height:44px;padding:0 12px;font-size:.9rem}
.runtop .btn.snd,.runtop .btn.snd[aria-pressed="true"]{background:var(--surf2);color:var(--fg);border-color:var(--line);white-space:nowrap}
.actbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surf);border-top:1px solid var(--line);
  padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.actbar .in{display:flex;gap:10px;max-width:720px;margin:0 auto}
.actbar .pri{flex:1;min-height:60px;font-size:1.1rem}
.actbar .btn:not(.pri){min-width:84px}
.timer.up{font-size:clamp(1.5rem,7vw,2.2rem);color:var(--mut);margin:6px 0 2px}
.pickgrp{margin-top:14px}
.pickgrp h3{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:500;margin-bottom:8px}
.hero .pri{min-width:160px}
.today-tag{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:99px;background:var(--acc);color:var(--on-acc);font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;vertical-align:middle}
ol.days{list-style:none;margin:0;padding:0;display:grid;gap:8px}
ol.days li{display:grid;grid-template-columns:3.2em minmax(0,1fr);gap:10px;align-items:start;padding:12px;border-radius:12px;background:var(--surf);border:1px solid var(--line)}
ol.days li[aria-current]{border-color:var(--acc);box-shadow:inset 4px 0 0 var(--acc)}
ol.days .dn{font-family:var(--f-mono);font-weight:500;padding-top:2px}
ol.days p{margin-top:6px}
@media (max-width:600px){
  .stage{padding:12px;gap:10px}
  .fig svg{max-height:30dvh}
  .timer{font-size:clamp(2.6rem,14vw,4.5rem)}
  .hero{flex-direction:column;align-items:stretch}
  .hero .pri{width:100%}
  .pick .btn{min-height:56px;padding:8px 12px}
  .pick .btn small{font-size:.7rem}
}
@media (orientation:landscape) and (max-height:520px){
  .stage{grid-template-columns:1fr 1fr;align-items:start}
  .fig svg{max-height:62dvh}
  body.running header.top{display:none}
  .timer{font-size:clamp(2rem,12vh,3.2rem);margin:4px 0}
  .actbar{padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
  .actbar .pri{min-height:48px}
  body.running{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
}
@media (min-width:900px){
  .stage{grid-template-columns:1.05fr 1fr;align-items:center;padding:22px}
  .two{grid-template-columns:1fr 1fr}
  .split{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;align-items:start}
}
svg .bd,svg .hot,svg .gnd,svg .band{fill:none;stroke-linecap:round;stroke-linejoin:round}
svg .bd{stroke:var(--fig);stroke-width:5}
svg .hot{stroke:var(--m);stroke-width:6}
svg .band{stroke:var(--m);stroke-width:3;stroke-dasharray:5 4}
svg .back{opacity:.55}
svg .head{fill:none;stroke:var(--fig);stroke-width:4.5}
svg .dot{fill:var(--m);opacity:.35}
svg .ring{fill:none;stroke:var(--m);stroke-width:3}
svg .fist{fill:var(--m)}
svg .wt{fill:var(--wt)}
svg .obj{fill:var(--obj)}
svg .gnd{stroke:var(--line);stroke-width:2}
svg.breath .arm{transform-box:view-box;transform-origin:100px 44px;animation:br-arm 10s ease-in-out infinite}
svg.breath .belly{fill:var(--m);opacity:.4;transform-box:fill-box;transform-origin:left center;animation:br-belly 10s ease-in-out infinite}
svg.breath .btrack{fill:var(--line)}
svg.breath .bline{fill:var(--m);transform-box:fill-box;transform-origin:left center;animation:br-line 10s ease-in-out infinite}
svg.breath .bt{font-family:var(--f-mono);font-size:13px;fill:var(--fg);text-anchor:middle}
svg.breath .bi{animation:br-in 10s linear infinite}
svg.breath .bu{animation:br-out 10s linear infinite}
svg.breath .bs{display:none;font-size:11px}
svg.breath .arm,svg.breath .belly,svg.breath .bline,svg.breath .bi,svg.breath .bu{animation-delay:var(--bd,0s)}
.fig.paused svg *{animation-play-state:paused}
svg.tempo .tt1{font-family:var(--f-mono);font-size:14px;font-weight:500;fill:var(--m);text-anchor:middle}
svg.tempo .tt2{font-family:var(--f-mono);font-size:10px;fill:var(--mut);text-anchor:middle}
svg.tempo .btrack{fill:var(--line)}
svg.tempo .tbar{fill:var(--m)}
svg .rib{fill:var(--m);opacity:.3}
@keyframes br-arm{0%{transform:rotate(0)}40%{transform:rotate(-65deg)}100%{transform:rotate(0)}}
@keyframes br-belly{0%{transform:scaleX(1)}40%{transform:scaleX(1.9)}100%{transform:scaleX(1)}}
@keyframes br-line{0%{transform:scaleX(.02)}40%{transform:scaleX(1)}100%{transform:scaleX(.02)}}
@keyframes br-in{0%,39%{opacity:1}41%,100%{opacity:0}}
@keyframes br-out{0%,39%{opacity:0}41%,100%{opacity:1}}
.pa{animation:pa 3.2s ease-in-out infinite}
.pb{animation:pb 3.2s ease-in-out infinite}
@keyframes pa{0%,38%{opacity:1}50%,88%{opacity:0}100%{opacity:1}}
@keyframes pb{0%,38%{opacity:0}50%,88%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){
  .pa,.pb{animation:none}.pa{opacity:1}.pb{opacity:.3}
  svg.breath .arm,svg.breath .belly,svg.breath .bline{animation:none}
  svg.breath .bi,svg.breath .bu{display:none}
  svg.breath .bs{display:inline}
  .prog i{transition:none}
}
[hidden]{display:none!important}
img{max-width:100%}
</style>
</head>
<body>

<a class="skip" href="#main">Hopp til innhold</a>
<div id="live" class="sr" aria-live="polite" role="status"></div>

<header class="top wrap" role="banner">
  <h1>Løft og løp</h1>
  <div class="meta" id="meta"></div>
</header>

<nav class="bar" role="navigation" aria-label="Hovedmeny">
  <div class="in">
    <button type="button" data-act="view" data-v="okt">Økt</button>
    <button type="button" data-act="view" data-v="uke">Uke</button>
    <button type="button" data-act="view" data-v="logg">Logg</button>
    <button type="button" data-act="view" data-v="grunn">Grunnlag</button>
  </div>
</nav>

<main id="main" class="wrap" tabindex="-1"></main>

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var GV={glute:'--c-glute',quad:'--c-quad',ham:'--c-ham',core:'--c-core',plyo:'--c-plyo',run:'--c-ham'};

/* ---------- Figurer ---------- */
function side(p,hot,o){
  hot=hot||[];o=o||{};
  var T=p.T||[p.A[0]+12,p.A[1]];
  function ln(a,b,part){return '<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" class="'+(hot.indexOf(part)>=0?'hot':'bd')+'"/>';}

    var tt=(S.run&&!S.run.done)?elapsed():(now-start)/1000;

    var s=T.seq[i],f=Math.min(1,tt/s[2]),e=f<.5?2*f*f:1-Math.pow(-2*f+2,2)/2;
    var PS=T.poses||[T.A,T.B];

    if(i!==lastPh){var lbl=s[4]+' · '+String(s[2]).replace('.',',')+' s';if(lbl.length>14)lbl=s[4];
      t1.textContent=BW[s[3]];t2.textContent=lbl;lastPh=i;}
    bar.setAttribute('transform','translate(176 0) scale('+Math.max(.02,f)+' 1) translate(-176 0)');
    raf=requestAnimationFrame(frame);
  }

 p1:{n:'Marsj med høye kne',g:'quad',fig:'',time:1,cue:'Løft knærne og sving armene. Øk tempoet gradvis, pulsen mot 110–130.',

 v1:{n:'Syklus 1: Rolig start',g:'core',fig:'',time:1,cue:'Tøm lungene. Pust inn i magen i 4 s. Hold 7 s og svelg én gang. Pust ut i 8 s med en lav summetone, hmmm.',
  how:{s:'Sitt fremst på en stol, føttene bredere enn skuldrene. Len deg fram med albuene på knærne og la hodet henge tungt.',d:'Pust inn gjennom nesen så magen presses mot lårene. Hold pusten og svelg én gang. Pust ut gjennom munnen med en lav, jevn summetone.',m:'Presser pusten inn med skuldrene, holder så lenge at du blir svimmel.'}},
 v2:{n:'Syklus 2: Tunge og bekkenbunn',g:'core',fig:'',time:1,cue:'Pust inn i 4 s med tungen presset mot ganen. Hold 7 s og stram bekkenbunnen. Pust ut i 8 s med summetone og slipp alt.',
  how:{s:'Samme sittende stilling, hodet hengende.',d:'Press tungen mot ganen på innpusten. I holdet strammer du bekkenbunnen som når du knipper. På utpusten slipper du både tunge og bekkenbunn helt.',m:'Spenner rumpe og mage i stedet for bekkenbunnen, slipper ikke helt.'}},
 v3:{n:'Syklus 3: Se målet',g:'core',fig:'',time:1,cue:'Pust inn i 4 s og se for deg et mål du har nådd. Hold 7 s, kjenn følelsen og svelg. Pust ut i 8 s med summetone.',
  how:{s:'Samme sittende stilling.',d:'Se for deg øyeblikket der målet er nådd, med detaljer. Kjenn hvordan det føles i brystet og magen mens du holder. La følelsen spre seg på utpusten.',m:'Prøver for hardt. Det holder med et enkelt bilde.'}},
 v4:{n:'Syklus 4: Alt sammen',g:'core',fig:'',time:1,cue:'Pust inn i magen i 4 s. Hold 7 s med tungen mot ganen, bekkenbunnen strammet og ett svelg. Pust ut i 8 s med summetone og slipp alt.',
  how:{s:'Samme sittende stilling. Sett deg rolig opp til slutt og åpne øynene.',d:'Kombiner tunge, bekkenbunn og svelg i holdet. Slipp alt på den summende utpusten.',m:'Reiser deg brått etterpå. Bli sittende noen sekunder.'}},
 h1:{n:'Sentrerende pust og hilsen',g:'core',fig:'',time:1,cue:'Føttene samlet, armene langs siden. Pust dypt ned i magen. Avslutt med hilsen: høyre knyttneve mot venstre håndflate og et lett bukk.',
  how:{s:'Stå med føttene samlet og hendene langs siden.',d:'Pust inn gjennom nesen ned i magen i 4 s, pust ut i 6 s. Gjør hilsenen til slutt.',m:'Løfter skuldrene når du puster inn.'}},
 h2:{n:'Skulder- og kroppsrulling',g:'core',fig:'',time:1,cue:'Store, myke sirkler med skuldrene og overkroppen. Snu retning halvveis.',
  how:{s:'Stå hoftebredde med armene hengende løst.',d:'Rull skuldrene opp, bakover og ned, og la overkroppen følge med. Bytt retning etter halve tiden.',m:'Rykkete bevegelser, holder pusten.'}},
 h3:{n:'Håndledd og ankler',g:'core',fig:'',time:1,cue:'Rolige sirkler med håndleddene, og med én ankel om gangen. Bytt side halvveis.',
  how:{s:'Stå stødig, gjerne med en hånd mot vegg når du sirkler ankelen.',d:'Sirkle håndleddene mykt begge veier. Løft én fot og sirkle ankelen, bytt fot halvveis.',m:'For store eller raske sirkler. Hold det rolig hvis håndleddet prikker.'}},
 h4:{n:'Ryggradspust',g:'core',fig:'',time:1,cue:'Pust inn og åpne brystet, armene strekkes bakover, smil. Pust ut og krum ryggen lett.',
  how:{s:'Stå med bløte knær.',d:'Innpust: løft brystet og før armene bakover. Utpust: krum ryggen, la armene komme fram og haken synke. Bevegelsen går gjennom hele ryggen.',m:'Svaier i korsryggen i stedet for å åpne brystet, kaster hodet bakover.'}},
 h5:{n:'Nakke: ja og nei',g:'core',fig:'',time:1,cue:'Nikk rolig ja, opp og ned. Snu så hodet rolig nei fra side til side.',
  how:{s:'Stå eller sitt høyt, skuldrene avslappet.',d:'Nikk sakte ned og opp et par ganger. Snu deretter hodet rolig til hver side, bare så langt det er behagelig.',m:'Raske bevegelser, presser ut i ytterstilling.'}},
 h6:{n:'Skyt ørnen med buen',g:'core',fig:'',time:1,cue:'Bred hestestilling. Én hånd sikter ut til siden, den andre trekker buestrengen. Hold med dyp pust, slipp og bytt side.',
  how:{s:'Stå bredt med bøyde knær, håndleddene samlet foran brystet.',d:'Den ene hånden sikter ut til siden med pekefinger og tommel som en L. Den andre trekker buestrengen bakover ved brystet. Hold med myk styrke og dype pust i magen. Slipp buen og bytt side.',m:'Knærne faller innover, armen løftes over skulderhøyde, skuldrene trekkes opp.'}},
 h7:{n:'Skille himmel og jord',g:'core',fig:'',time:1,cue:'Øs foran magen. Én håndflate presser opp, den andre ned. Bytt side i takt med pusten.',
  how:{s:'Stå hoftebredde, hendene samlet foran magen.',d:'På innpust presser én håndflate opp og den andre ned, blikket følger den øverste hånden. På utpust samles hendene foran magen. Bytt side.',m:'Strekker albuen helt. Med vond skulder: løft bare til hodehøyde.'}},
 h8:{n:'Favne treet, tre pust',g:'core',fig:'',time:1,cue:'Armene krummet foran brystet som rundt en trestamme. Tre lange, bevisste utpust.',
  how:{s:'Bløte knær, armene i en rund ring foran brystet.',d:'Pust inn rolig, og la utpusten bli lang og tømmende. Kjenn at skuldrene synker.',m:'Løfter skuldrene, spenner armene.'}},
 h9:{n:'Tigeren',g:'core',fig:'',time:1,cue:'Len deg fram med rett rygg og strake armer. På utpust føres overkroppen over det ene benet, tilbake, så over det andre.',
  how:{s:'Føttene bredt, knærne lett bøyd, overkroppen fram med rett rygg og armene i forlengelsen.',d:'Før overkroppen mykt ut over ett ben på utpust, tilbake til midten på innpust, og over det andre benet.',m:'Runder ryggen, låser knærne.'}},
 h10:{n:'Foroverbøy med bryståpner',g:'core',fig:'',time:1,cue:'Fold fram med god bøy i knærne. Flett hendene bak ryggen og løft mot taket. Fem rolige pust, rull opp. To ganger.',
  how:{s:'Stå hoftebredde, hendene flettet bak ryggen.',d:'Bøy i knærne og fold overkroppen fram. Løft de flettede hendene bort fra ryggen. Hold fem rolige pust og rull rolig opp.',m:'Strake knær som belaster korsryggen. Med vond skulder eller prikking i hånden: løft bare litt, eller la hendene hvile på korsryggen.'}},
 h11:{n:'Risting og sprett',g:'core',fig:'',time:1,cue:'Rist og sprett mykt på føttene. Sukk høyt ut.',
  how:{s:'Stå løst med bløte knær.',d:'Sprett lett i knærne og la armene og skuldrene riste løst. Sukk hørbart på utpust.',m:'Hopper for hardt. Kjenner du bekkenbunnen, hold sprettene små.'}},
 h12:{n:'Stående meditasjon',g:'core',fig:'',time:1,cue:'Stå helt stille med armene i ring. Pusten roer seg, oppmerksomheten synker ned i magen.',
  how:{s:'Bløte knær, armene i en rund ring foran brystet.',d:'Stå stille omtrent ett minutt. Kjenn føttene mot gulvet og pusten i magen.',m:'Låser knærne, holder pusten.'}},
 h13:{n:'Samle himmel og jord',g:'core',fig:'',time:1,cue:'Løft hendene ut til siden med håndflatene opp. Senk dem foran kroppen med håndflatene ned. Avslutt med hilsen.',
  how:{s:'Stå med føttene samlet.',d:'Innpust: hendene løftes ut til siden med håndflatene opp. Utpust: de senkes foran kroppen med håndflatene ned. Avslutt med hilsen og et lett bukk.',m:'Løfter skuldrene med armene.'}}
};
var QI=[['qi1',75],['qi2',90],['qi3',90],['qi4',90],['qi5',75],['qi6',60]];
var NK={b0:1,b1:1,b2:1,b3:1,b4:1,b5:1,b6:1,b7:1,b8:1,b9:1,h1:1,h2:1,h3:1,h4:1,h5:1,h6:1,h7:1,h8:1,h9:1,h10:1,h11:1,h12:1,h13:1,qi1:1,qi2:1,qi3:1,qi4:1,qi5:1,qi6:1,sk1:1,sk2:1,sk3:1,sk4:1,sk5:1,row:1,extrot:1,pullapart:1,spunch:1};

/* ---------- Tilstand ---------- */
var S={view:'okt',sess:['A','K','K','Q','B','K','P'][(new Date().getDay()+6)%7],wkOv:0,kv:'easy',mins:30,run:null,
  log:{entries:[],sessions:[],settings:{jump:1,sound:true}},store:'',saved:'',confirmEnd:false};
function today(){try{return new Date().toLocaleDateString('sv-SE');}catch(e){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}}
function curWeek(){if(S.wkOv)return S.wkOv;var st=new Date(2026,9,19),n=new Date(),t=new Date(n.getFullYear(),n.getMonth(),n.getDate());var d=Math.floor((t-st)/864e5);return Math.max(1,Math.min(12,Math.floor(d/7)+1));}
function phaseIdx(w){return w<=4?0:(w<=8?1:2);}
function rxFor(id){var r=EX[id].rx[phaseIdx(curWeek())];return {sets:r[0],lo:r[1],hi:r[2]};}
function fmt(sec){sec=Math.max(0,Math.ceil(sec));var m=Math.floor(sec/60),s=sec%60;return ('0'+m).slice(-2)+':'+('0'+s).slice(-2);}
function live(t){$('#live').textContent='';setTimeout(function(){$('#live').textContent=t;},30);}

/* ---------- Historikk og forslag ---------- */
function hist(id){var m={};S.log.entries.forEach(function(e){if(e.ex===id){(m[e.d]=m[e.d]||[]).push(e);}});return Object.keys(m).sort().map(function(d){return {d:d,es:m[d]};});}
function suggest(id){
  var h=hist(id);if(!h.length)return null;
  var last=h[h.length-1].es,kg=Math.max.apply(null,last.map(function(e){return e.kg||0;}));
  var r=rxFor(id),hit=last.length>=r.sets&&last.every(function(e){return e.r>=r.hi;});
  return {kg:hit?kg+2.5:kg,up:hit,last:last};
}

/* ---------- Bygg økt ---------- */
function strengthSteps(ids){
  var out=[];
  ids.forEach(function(id,xi){
    var r=rxFor(id),ex=EX[id];
    for(var s=1;s<=r.sets;s++){
      out.push({k:'reps',ex:id,set:s,of:r.sets,lo:r.lo,hi:r.hi});
      var lastOfAll=(xi===ids.length-1&&s===r.sets);
      if(!lastOfAll){
        var nextId=(s<r.sets)?id:ids[xi+1],nextSet=(s<r.sets)?s+1:1;
        out.push({k:'rest',ex:nextId,dur:(s<r.sets?ex.rest:60),nextSet:nextSet,label:s<r.sets?'Neste sett':'Neste øvelse'});
      }
    }
  });
  return out;
}
function tm(id,dur,extra){var o={k:'time',ex:id,dur:dur};if(extra)for(var k in extra)o[k]=extra[k];return o;}
function qiSteps(scale){return QI.map(function(q){return tm(q[0],Math.round(q[1]*scale));});}
function pfSteps(){var o=[];for(var i=1;i<=3;i++){o.push(tm('pf',45,{set:i,of:3,sub:['Liggende','Stående','I bevegelse'][i-1]}));if(i<3)o.push({k:'rest',ex:'pf',dur:15,nextSet:i+1,label:'Neste sett',timeNext:true});}return o;}
/* Oppvarming: 4 min puls (mot 110–130 bpm), 3 Baduanjin-øvelser som åpner hofter og bakside, bekkenbunn, så et lett spesifikt sett. */
function warmSteps(){return [tm('p1',60),tm('p2',60),tm('p3',60),tm('p4',60),tm('b2',60),tm('b5',60),tm('b6',60)];}
function baduanjin(){return [tm('b0',40),tm('b1',90),tm('b2',100),tm('b3',80),tm('b4',70),tm('b5',90),tm('b6',80),tm('b7',90),tm('b8',50),tm('b9',40)];}
function buildSteps(sess){
  var w=curWeek(),ph=phaseIdx(w),st=[];
  if(sess==='A'){
    st=st.concat(warmSteps(),pfSteps(),[tm('wA',45)],strengthSteps(['hipthrust','rdl','chairsquat','latwalk','row','extrot']));
  }else if(sess==='B'){
    var jl=Math.min(S.log.settings.jump||1,4);
    st=st.concat(warmSteps(),pfSteps());
    if(ph===0)st.push(tm('jump',60,{sub:'Nivåsjekk · nivå '+Math.min(S.log.settings.jump||1,4)}));
    else for(var j=1;j<=3;j++){st.push(tm('jump',30,{set:j,of:3,sub:'Nivå '+jl}));st.push({k:'rest',ex:'jump',dur:45,nextSet:j+1,label:j<3?'Neste sett':'Neste øvelse',timeNext:true});}
    st=st.concat([tm('wB',45)],strengthSteps(['bss','stepup','slthrust','sidelying','pullapart','spunch']));
  }else if(sess==='K'){
    st.push(tm('runw',S.kv==='easy'?300:600));
    if(S.kv==='easy')st.push(tm('runz',S.mins*60));
    else for(var i=1;i<=4;i++){st.push(tm('runt',240,{set:i,of:4}));if(i<4)st.push(tm('runr',180));}
    st.push(tm('runc',300));
  }else if(sess==='V'){
    st=[tm('v1',63),tm('v2',63),tm('v3',63),tm('v4',63)];
  }else if(sess==='H'){
    st=[tm('h1',40),tm('h2',40),tm('h3',40),tm('h4',45),tm('h5',40),tm('h6',90),tm('h7',60),tm('h8',45),tm('h9',60),tm('h10',70),tm('h11',30),tm('h12',60),tm('h13',40)];
  }else if(sess==='P'){
    st=[tm('pb1',130),tm('pb2',130),tm('pb3',45),tm('pb4',90),tm('pb5',45)];
  }else if(sess==='W'){
    st=[tm('sk1',60),tm('sk2',60),tm('sk3',60),tm('sk4',60),tm('sk5',70)];
  }else{
    st=baduanjin();
  }
  return st;
}
function planOf(steps){
  var out=[],prev=null;
  steps.forEach(function(s){
    if(s.k==='rest')return;
    if(prev&&prev.ex===s.ex){prev.n++;prev.dur+=s.dur||0;return;}
    prev={ex:s.ex,n:1,dur:s.dur||0,k:s.k,lo:s.lo,hi:s.hi};out.push(prev);
  });
  return out;
}
function planDetail(p){
  var ex=EX[p.ex];
  if(p.k==='reps'){var u=ex.unit==='steg'?' steg':'';return p.n+' × '+p.lo+(p.hi!==p.lo?'–'+p.hi:'')+u;}
  var m=Math.round(p.dur/60*10)/10;return (m<1?p.dur+' s':String(m).replace('.',',')+' min')+(p.n>1&&p.k==='time'?'':'');
}
function estMin(steps){var t=0;steps.forEach(function(s){t+=(s.k==='reps')?45:s.dur;});return Math.round(t/60);}

/* ---------- Motor ---------- */
var tick=null,ac=null,wl=null,saveT=null,saving=false,pending=false,ref=null;
function beep(f,d){if(!S.log.settings.sound)return;try{if(navigator.vibrate)navigator.vibrate(Math.round((d||.12)*1000));}catch(e){}try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+(d||.12));}catch(e){}}
function startSession(){
  var steps=buildSteps(S.sess);
  S.run={steps:steps,i:0,t0:performance.now(),paused:false,pausedAt:0,begun:Date.now(),logged:[],cur:null,last:99,done:false,sess:S.sess,nk:0};
  S.confirmEnd=false;
  enter(0,true);
  try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(function(l){wl=l;}).catch(function(){});}catch(e){}
  clearInterval(tick);tick=setInterval(onTick,200);
  beep(880);
}
function stepName(s){var ex=EX[s.ex];return ex.n;}
function enter(i,first){
  var r=S.run;r.i=i;r.t0=performance.now();r.paused=false;r.last=99;
  var s=r.steps[i];
  if(s.k==='reps'){
    var prev=null;r.logged.forEach(function(l){if(l.e.ex===s.ex)prev=l.e;});
    var sg=suggest(s.ex);
    r.cur={kg:prev?prev.kg:(sg?sg.kg:0),r:s.hi};
  }
  var t=(s.k==='rest')?'Hvile. '+s.label+': '+EX[s.ex].n:EX[s.ex].n+(s.set?', sett '+s.set+' av '+s.of:'');
  live(t);render();
  if(!first){try{window.scrollTo(0,0);}catch(e){}}
  var p=$('#primary');if(p&&!first)p.focus({preventScroll:true});
}
function accrue(){var r=S.run;if(!r||r.done)return;var s=r.steps[r.i];if(s&&s.k!=='rest'&&NK[s.ex])r.nk+=Math.min(elapsed(),s.k==='time'?s.dur:300);}
function advance(){var r=S.run;accrue();if(r.i+1>=r.steps.length){finish(true);return;}beep(880);enter(r.i+1);}
function elapsed(){var r=S.run;return ((r.paused?r.pausedAt:performance.now())-r.t0)/1000;}
function onTick(){
  var r=S.run;if(!r||r.done||r.paused)return;
  var s=r.steps[r.i],e=elapsed(),tmEl=$('#tm'),bar=$('#bar');
  if(s.k==='reps'){if(tmEl)tmEl.textContent=fmt(Math.floor(e));return;}
  var rem=s.dur-e;
  if(rem<=0){advance();return;}
  if(tmEl)tmEl.textContent=fmt(rem);
  if(bar)bar.style.width=Math.min(100,e/s.dur*100)+'%';
  var w=Math.ceil(rem);if(w<=3&&w!==r.last){beep(660,.08);}r.last=w;
}
function togglePause(){var r=S.run;if(r.paused){r.t0+=performance.now()-r.pausedAt;r.paused=false;}else{r.paused=true;r.pausedAt=performance.now();}render();live(r.paused?'Pause':'Fortsetter');}
function doneSet(){
  var r=S.run,s=r.steps[r.i];
  var e={id:newId(),d:today(),s:r.sess,ex:s.ex,n:s.set,kg:EX[s.ex].nokg?0:(r.cur.kg||0),r:r.cur.r||0};
  S.log.entries.push(e);r.logged.push({i:r.i,e:e});scheduleSave();advance();
}
function undo(){
  var r=S.run,l=r.logged.pop();if(!l)return;
  var ix=S.log.entries.lastIndexOf(l.e);if(ix>=0)S.log.entries.splice(ix,1);
  (S.log.del=S.log.del||[]).push(eKey(l.e));
  scheduleSave();enter(l.i);

function skip(){advance();}
function addTime(){var r=S.run;r.steps[r.i].dur+=15;render();}
function finish(accrued){
  var r=S.run;if(!accrued)accrue();r.done=true;clearInterval(tick);try{if(wl)wl.release();}catch(e){}
  r.secs=Math.round((Date.now()-r.begun)/1000);
  S.log.sessions.push({id:newId(),d:today(),s:r.sess,secs:r.secs,sets:r.logged.length,nk:Math.round(r.nk)});
  scheduleSave();beep(988,.25);live('Økten er ferdig');render();
}
function abort(){
  if(!S.confirmEnd){S.confirmEnd=true;render();live('Trykk Avslutt en gang til for å avslutte');return;}
  accrue();var r=S.run;
  if(r&&r.nk>=60){S.log.sessions.push({id:newId(),d:today(),s:r.sess,secs:Math.round((Date.now()-r.begun)/1000),sets:r.logged.length,nk:Math.round(r.nk),partial:true});scheduleSave();}
  clearInterval(tick);try{if(wl)wl.release();}catch(e){}
  S.run=null;S.confirmEnd=false;render();
}

/* ---------- Lagring ---------- */
/* Flere faner og enheter kan skrive samme logg. Hver lagring leser først det som ligger lagret,
   slår sammen (union) og skriver så tilbake, så ingen visning overskriver en annen. Slettinger huskes i del. */
function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function eKey(e){return e.id||[e.d,e.s,e.ex,e.n,e.kg,e.r].join('|');}
function sKey(s){return s.id||[s.d,s.s,s.secs,s.sets,s.manual?'m':'',s.partial?'p':''].join('|');}
function mergeLog(a,b){
  a=a||{};b=b||{};var del={};(a.del||[]).concat(b.del||[]).forEach(function(k){del[k]=1;});
  function u(xa,xb,f){var seen={},out=[];(xa||[]).concat(xb||[]).forEach(function(x){var k=f(x);if(!seen[k]&&!del[k]){seen[k]=1;out.push(x);}});return out;}
  var st={};var bs=b.settings||{},as=a.settings||{};for(var k in bs)st[k]=bs[k];for(var k2 in as)st[k2]=as[k2];
  return {entries:u(a.entries,b.entries,eKey),sessions:u(a.sessions,b.sessions,sKey).sort(function(x,y){return x.d<y.d?-1:(x.d>y.d?1:0);}),settings:st,del:Object.keys(del)};
}
function sizeOf(l){return (l.entries||[]).length+'/'+(l.sessions||[]).length+'/'+(l.del||[]).length;}
function snapshot(){return {v:2,entries:S.log.entries,sessions:S.log.sessions,settings:S.log.settings,del:S.log.del||[]};}
function clock(){var d=new Date();return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);}
function setStatus(t){S.saved=t;var a=$('#saved');if(a)a.textContent=t;var b=$('#savestat');if(b)b.textContent=t;}

function lsSave(){try{localStorage.setItem('loft-og-lop',JSON.stringify(snapshot()));return true;}catch(e){return false;}}
function adopt(remote){var before=sizeOf(S.log),m=mergeLog(S.log,remote);S.log.entries=m.entries;S.log.sessions=m.sessions;S.log.settings=m.settings;S.log.del=m.del;return sizeOf(S.log)!==before;}
function doSave(){
  if(saving){pending=true;return;}

  var p=ref?ref.get().then(function(sn){if(sn.exists&&adopt(sn.data())&&!S.run)render();return ref.set(snapshot());}):Promise.resolve();
  p.then(function(){lsSave();setStatus(ref?'Lagret i kontoen din '+clock():(okLs?'Lagret på denne enheten '+clock():'Kan ikke lagre i denne visningen. Åpne appen på claude.ai i nettleseren.'));})
   .catch(function(e){setStatus('Kunne ikke lagre i kontoen'+(e&&e.code?' ('+e.code+')':'')+(okLs?'. Lagret på denne enheten, prøver igjen ved neste endring.':'.'));})

function initStore(){
  var use=(window.claude&&window.claude.use)?window.claude.use.bind(window.claude):null;
  try{var t=localStorage.getItem('loft-og-lop');if(t)adopt(JSON.parse(t));}catch(e){}
  function local(){S.store='ls';render();}
  if(!use){local();return;}
  Promise.all([use('db'),use('user')]).then(function(r){
    var db=r[0],user=r[1];
    if(!db||!user){local();return;}
    return user.id().then(function(id){
      if(!id){local();return;}
      ref=db.doc('data/users/'+id+'/logg');
      return ref.get().then(function(sn){
        var before=sizeOf(S.log);if(sn.exists)adopt(sn.data());S.store='db';
        var remoteSize=sn.exists?sizeOf(mergeLog(sn.data(),{})):'';
        if(!sn.exists||sizeOf(S.log)!==remoteSize)scheduleSave();
        if(!S.run)render();
        ref.onSnapshot(function(s2){if(s2.exists&&!s2.metadata.hasPendingWrites&&adopt(s2.data())&&!S.run)render();},function(){});
      });
    });
  }).catch(function(){ref=null;local();});
}

function recentCard(){
  var list=S.log.sessions.map(function(s,i){return {s:s,i:i};}).sort(function(a,b){return a.s.d<b.s.d?1:(a.s.d>b.s.d?-1:b.i-a.i);}).slice(0,8);
  if(!list.length)return '<div class="card sec"><h3>Siste økter</h3><p class="note" style="margin-top:6px">Ingen økter ennå. Fullfør en økt i appen, eller registrer en over.</p></div>';
  return '<div class="card sec"><h3>Siste økter</h3><ul class="recent">'+list.map(function(o){var s=o.s,m=Math.max(1,Math.round((s.secs||0)/60)),d=s.d.slice(8)+'.'+s.d.slice(5,7);
    var conf=S.confirmDel===o.i;
    return '<li><span class="rd">'+d+'</span><div><b>'+esc(SESS[s.s]?SESS[s.s].n:s.s)+'</b><div class="note">'+m+' min'+(s.manual?' · registrert':'')+(s.partial?' · avbrutt':'')+'</div></div>'+
      '<button type="button" class="btn ghost del" data-act="del" data-i="'+o.i+'" aria-label="'+(conf?'Bekreft sletting av ':'Slett ')+esc(SESS[s.s]?SESS[s.s].n:s.s)+' '+d+'">'+(conf?'Trykk igjen':'Slett')+'</button></li>';}).join('')+'</ul></div>';
}
function viewLogg(){
  var ids=['hipthrust','rdl','chairsquat','bss','stepup','slthrust'];
  var full=S.log.sessions.filter(function(s){return !s.partial;}),total=full.length,wk=0,ms=monday(today());
  full.forEach(function(s){if(s.d>=ms)wk++;});
  var h='<section aria-labelledby="h-l"><div class="sec" style="margin-top:6px"><h2 id="h-l" style="font-size:1.6rem">Logg og progresjon</h2><p class="note" style="margin-top:6px">'+total+' økter logget · '+wk+' denne uka · '+(S.store==='db'?'Lagres i kontoen din':'Lagres bare på denne enheten')+'</p><p class="note" id="savestat" role="status" aria-live="polite">'+esc(S.saved||'')+'</p></div>';
  h+=neckCard(ms)+dailyCard(ms)+manualCard()+recentCard();
  var any=S.log.entries.some(function(e){return !EX[e.ex].nokg;});
  if(!any){
    h+='<div class="card ex sec" style="--m:var(--c-glute)"><div class="kick">Eksempel, ikke dine tall</div><div class="lift"><div class="top"><h3>Hip thrust</h3><span class="big-n">17,5 kg</span></div>'+spark([10,12.5,12.5,15,15,17.5],'Eksempel: hip thrust fra 10 til 17,5 kilo')+
     '<p class="note">Slik ser en lift ut etter noen uker: toppsett per økt, og neste vekt foreslås når alle sett treffer øvre reps. Dine egne tall dukker opp her etter første økt.</p></div></div>';
  }
  h+='<div class="grid3 sec">';
  ids.forEach(function(id){
    var ex=EX[id],hs=hist(id),vals=hs.map(function(x){return Math.max.apply(null,x.es.map(function(e){return e.kg;}));}),sg=suggest(id),r=rxFor(id);
    h+='<div class="card lift" '+mcol(ex.g)+'><div class="top"><h3>'+esc(ex.n)+'</h3><span class="big-n">'+(vals.length?vals[vals.length-1]+' kg':'—')+'</span></div>'+
      spark(vals,ex.n+', toppvekt per økt')+'<p class="note">'+(sg?('Sist: '+sg.last.map(function(e){return e.r;}).join(', ')+' reps. '+(sg.up?'Neste gang: '+sg.kg+' kg.':'Mål: '+r.sets+' × '+r.hi+' på samme vekt, så +2,5 kg.')):'Ingen sett logget ennå. Mål: '+r.sets+' × '+r.lo+'–'+r.hi+'.')+'</p></div>';
  });
  h+='</div></section>';
  return h;
}
function viewUke(){
  var w=curWeek(),pi=phaseIdx(w);
  var days=[
   ['Man','Styrke A','Pulsoppvarming og Baduanjin, bekkenbunn, hip thrust, markløft, knebøy, sidesteg, roing og utadrotasjon med strikk','glute'],
   ['Tir','Rolig kondisjon','30–40 min under 140 bpm, eller bare sykkelpendling','run'],
   ['Ons','Terskel eller rolig','Terskel 4 × 4 min (148–154 bpm) når beina er friske. Minst 48 t etter Styrke A','run'],
   ['Tor','Qi gong eller hvile','Baduanjin (12 min) eller Høst-qi gong (11 min)','core'],
   ['Fre','Styrke B','Pulsoppvarming og Baduanjin, bekkenbunn, hoppstige, bulgarsk splittknebøy, step-ups, ett-bens hip thrust, strikk fra hverandre og serratus-skyv','quad'],
   ['Lør','Lang og rolig','Tur eller rolig løping i sone 1–2','run'],
   ['Søn','Hvile og logg','Se over ukas tall i Logg','core']];
  var td=(new Date().getDay()+6)%7,DL=['Mandag','Tirsdag','Onsdag','Torsdag','Fredag','Lørdag','Søndag'];
  var h='<section aria-labelledby="h-u"><div class="sec" style="margin-top:6px"><h2 id="h-u" style="font-size:1.6rem">12-ukers plan</h2></div>';
  h+='<div class="row sec" role="group" aria-label="Velg uke" style="align-items:center"><button type="button" class="btn" data-act="wk" data-d="-1" aria-label="Forrige uke">−</button><span class="big-n" style="min-width:5.5em;text-align:center">Uke '+w+'</span><button type="button" class="btn" data-act="wk" data-d="1" aria-label="Neste uke">+</button><span class="note">Uke 1 startet mandag 19. oktober 2026</span></div>';
  h+='<div class="grid3 sec">'+PH.map(function(p,i){return '<div class="card ph'+(i===pi?' on':'')+'" '+(i===pi?'aria-current="true"':'')+'><div class="kick">'+p.w+'</div><h3>'+p.n+'</h3><p class="note" style="margin-top:6px">'+['3 × 8–10 på hovedløft, '+p.rir+'. Lær bevegelsene og finn vekter som er tunge nok.','4 × 5–6 tungt på hip thrust, markløft og bulgarsk splittknebøy, rundt 80 % av maks. Hopp kommer inn i Styrke B.','4 × 8–12 på hovedløft, siste sett nær utmattelse. Mer volum for muskelvekst.'][i]+'</p></div>';}).join('')+'</div>';
  h+='<div class="sec"><h2>En vanlig uke</h2><ol class="days" style="margin-top:10px">'+
   days.map(function(d,i){return '<li'+(i===td?' aria-current="date"':'')+'><span class="dn"><abbr title="'+DL[i]+'" style="text-decoration:none">'+d[0]+'</abbr></span><div><span class="tag" '+mcol(d[3])+'>'+d[1]+'</span>'+(i===td?'<span class="sr"> (i dag)</span>':'')+'<p class="note">'+d[2]+'</p></div></li>';}).join('')+'</ol></div>';
  h+='<div class="card sec"><h3>Daglige rutiner</h3><ul class="clean" style="margin-top:10px"><li><b>Bekkenbunn, 7 min:</b> hver dag i minst tre måneder, deretter 4–5 dager i uka. Knip før hoste, nys og løft gjør du hele tiden.</li><li><b>Skulder og nakke, 5 min:</b> hver dag, rolig, helst på samme tid som qi gong.</li><li><b>Nakke og skulder totalt:</b> sikt mot rundt 2 timer i uka med qi gong, Skulder og nakke og skulderblad-delen i styrkeøktene. Logg viser hvor du ligger.</li><li>Rutinene teller ikke som trening. De kan gjøres samme dag som alle øktene, også på hviledager.</li></ul></div>';
  h+='<div class="card sec"><h3>Vinter og glatt føre</h3><ul class="clean" style="margin-top:10px"><li>Rolig kondisjon kan være tredemølle, innendørs sykkel, rask gange eller løping med brodder.</li><li>Terskel gjøres helst innendørs når det er glatt, så pulsen kan holdes jevn.</li><li>Sykkelpendlingen teller som ekstra beinvolum. Merker du tunge bein på Styrke-dager, kutt en rolig kondisjonsøkt først.</li></ul></div></section>';
  return h;
}
function viewGrunn(){
  var h='<section aria-labelledby="h-g"><div class="sec" style="margin-top:6px"><h2 id="h-g" style="font-size:1.8rem">Dette bygger programmet på</h2><p class="cue" style="margin-top:6px">Sterkere bein og større rumpe, uten å ødelegge restitusjonen til løpeøktene.</p></div>';
  h+='<div class="split sec"><div class="two">';
  var P=[
   ['Hip thrust og knebøy','Hip thrust og knebøy gir like mye vekst i setemusklene, og knebøy bygger i tillegg forside lår (Plotkin mfl. 2023). Derfor har programmet begge, pluss rumensk markløft for baksiden.'],
   ['Tungt i fase 2','Tung styrketrening, rundt 80 % av maks eller mer, bedrer løpsøkonomi og løpsprestasjon. Moderate vekter gjør det i liten grad (Llanos-Lagos mfl. 2024). Fase 2 er derfor 4 × 5–6. Er manualene for lette, bruk ett-bens varianter eller tyngre sekk.'],
   ['Nær utmattelse for muskelvekst','Muskelvekst øker jo nærmere utmattelse settene stopper, mens styrke øker omtrent likt (Robinson mfl. 2024). Siste fase går derfor til RIR 0–1.'],
   ['Hopp fra uke 5','Plyometri bedrer løpsøkonomien, særlig i rolig tempo under 12 km/t (Llanos-Lagos mfl. 2024). Hoppstigen starter med hostetest for bekkenbunnen.'],
   ['Ett-bens-øvelser','Løping skjer på ett ben om gangen. Bulgarsk splittknebøy, step-ups og ett-bens hip thrust trener stabilitet og kraft på hvert ben.'],
   ['Skulderblad-styrke','Styrketrening for skulderblad og skulder reduserer nakke- og skuldersmerter (Gross mfl. 2015, Andersen mfl. 2014). Strikkøvelsene ligger i begge styrkeøktene, uten løft over hodet.'],
   ['Qi gong teller','Qi gong virker omtrent like godt som styrketrening mot langvarige nakkesmerter (de Zoete mfl. 2020). Samlet mål er rundt 2 timer i uka (Xie mfl. 2025).'],
   ['Bekkenbunn','Godt dokumentert mot lekkasje, også hos kvinner som trener og hopper (Dumoulin mfl. 2018, Rodríguez-Longobardo mfl. 2023). Knip før hoste er testet i egen studie (Miller mfl. 1998).'],
   ['Plassert rundt løpingen','Minst 48 timer mellom Styrke A og terskel. Hopp legges ikke tett før terskel eller intervaller.'],
   ['Skånsomt for skuldre og håndledd','Ingen stang på ryggen og ingen løft over hodet. Strikken ligger rundt hånden i stedet for et hardt grep, av hensyn til carpal tunnel.']];
  h+=P.map(function(p){return '<div class="card"><h3 style="font-size:1.1rem">'+p[0]+'</h3><p class="note" style="margin-top:6px;font-size:.95rem">'+p[1]+'</p></div>';}).join('');
  h+='</div><div><div class="card"><h3>Hva en trener gjør bedre</h3><ul class="clean" style="margin-top:10px"><li>Vurderer teknikk på video, særlig hip thrust, markløft og bulgarsk splittknebøy.</li><li>Justerer når noe gjør vondt eller er stivt.</li><li>Gir ansvarlighet og et menneske å rapportere til.</li><li>Ser helheten med søvn, kosthold og belastning.</li></ul></div>'+
   '<div class="card sec"><h3>Kilder</h3><ol class="refs" style="margin-top:10px">'+
   [['Plotkin mfl. 2023, Front Physiol','10.3389/fphys.2023.1279170'],['Llanos-Lagos mfl. 2024, Sports Med (løpsøkonomi)','10.1007/s40279-023-01978-y'],['Llanos-Lagos mfl. 2024, Sports Med (prestasjon)','10.1007/s40279-024-02018-z'],['Robinson mfl. 2024, Sports Med','10.1007/s40279-024-02069-2'],['Gross mfl. 2015, Cochrane','10.1002/14651858.CD004250.pub5'],['Andersen mfl. 2014, J Occup Rehabil','10.1007/s10926-013-9441-1'],['de Zoete mfl. 2020, Br J Sports Med','10.1136/bjsports-2020-102664'],['Xie mfl. 2025, Spine J','10.1016/j.spinee.2025.07.006'],['Dumoulin mfl. 2018, Cochrane','10.1002/14651858.CD005654.pub4'],['Rodríguez-Longobardo mfl. 2023, Sports Health','10.1177/19417381231195305'],['Miller mfl. 1998, J Am Geriatr Soc','10.1111/j.1532-5415.1998.tb02721.x']].map(function(r){return '<li><a href="https://doi.org/'+r[1]+'" target="_blank" rel="noopener">'+r[0]+'</a></li>';}).join('')+'</ol></div>'+
   '<div class="card sec"><h3>Spørsmål til Abel</h3><div style="margin-top:6px">'+
   ['Eksakt pris per måned, bindingstid og oppsigelse','Hva betyr personlig oppfølging: svartid, videofeedback, ukentlig justering?','Hvem bygger programmet, og hvilken erfaring har Siri med løpere og hypertrofi?','Kan programmet ta hensyn til intervall- og terskeløkter og Samsung Health-data?','Kan jeg prøve én måned før jeg binder meg?','Hva ville du endret i dette programmet?'].map(function(q,i){return '<label class="chk" for="q'+i+'"><input id="q'+i+'" type="checkbox"><span>'+q+'</span></label>';}).join('')+'</div></div></div></div></section>';
  return h;
}
/* Hold fokus på samme kontroll etter at visningen tegnes på nytt (WCAG 2.4.3) */
function focusKey(el){
  if(!el||el===document.body||!el.getAttribute)return null;
  if(el.id)return '#'+el.id;
  var a=el.getAttribute('data-act');if(!a)return null;
  var sel='[data-act="'+a+'"]';['data-v','data-s','data-d','data-i','data-k'].forEach(function(k){var v=el.getAttribute(k);if(v!==null)sel+='['+k+'="'+v+'"]';});
  return sel;
}
function render(){
  var m=$('#main'),v=S.view,h='',fk=m.contains(document.activeElement)?focusKey(document.activeElement):null;
  document.body.classList.toggle('running',!!(S.run&&!S.run.done)&&v==='okt');
  $('#meta').textContent=metaLine();
  var buttons=document.querySelectorAll('nav.bar button');
  for(var i=0;i<buttons.length;i++){var b=buttons[i];if(b.getAttribute('data-v')===v)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');}
  if(v==='okt')h=viewOkt();else if(v==='uke')h=viewUke();else if(v==='logg')h=viewLogg();else h=viewGrunn();
  m.innerHTML=h;
  if(fk){try{var t=m.querySelector(fk);if(t)t.focus({preventScroll:true});}catch(e){}}
  animTempo();
}
function planToday(){return ['A','K','K','Q','B','K','P'][(new Date().getDay()+6)%7];}

/* ---------- Hendelser ---------- */
document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]');if(!el)return;
  var a=el.getAttribute('data-act'),r=S.run;
  if(a==='view'){S.view=el.getAttribute('data-v');S.confirmEnd=false;render();window.scrollTo(0,0);}
  else if(a==='sess'){S.sess=el.getAttribute('data-s');render();var hh=$('#h-okt');if(hh){hh.focus({preventScroll:true});}
    try{window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});}catch(e){window.scrollTo(0,0);}
    live('Valgt: '+SESS[S.sess].n);}
  else if(a==='sound'){S.log.settings.sound=!S.log.settings.sound;scheduleSave();render();live(S.log.settings.sound?'Lyd og vibrasjon på':'Lyd og vibrasjon av');}
  else if(a==='kv'){S.kv=el.getAttribute('data-v');render();}
  else if(a==='min'){S.mins=+el.getAttribute('data-v');render();}
  else if(a==='jump'){S.log.settings.jump=+el.getAttribute('data-v');scheduleSave();render();}
  else if(a==='wk'){S.wkOv=Math.max(1,Math.min(12,curWeek()+(+el.getAttribute('data-d'))));render();}
  else if(a==='start'){startSession();}
  else if(a==='done'){doneSet();}
  else if(a==='skip'){skip();}
  else if(a==='plus'){addTime();}
  else if(a==='pause'){togglePause();}
  else if(a==='undo'){undo();}
  else if(a==='abort'){abort();}
  else if(a==='closeDone'){S.run=null;render();}
  else if(a==='manual'){
    var ty=$('#man-type').value,mn=parseFloat(String($('#man-min').value).replace(',','.')),dt=$('#man-date').value||today();
    if(!(mn>0)){live('Skriv inn antall minutter');$('#man-min').focus();return;}
    var nk=(ty==='Q'||ty==='H'||ty==='W')?mn*60:((ty==='A'||ty==='B')?Math.min(mn,14)*60:0);
    S.log.sessions.push({id:newId(),d:dt,s:ty,secs:Math.round(mn*60),sets:0,nk:Math.round(nk),manual:true});
    S.manMin=null;S.manDate=null;scheduleSave();render();live('Lagret: '+SESS[ty].n+', '+mn+' min');
  }
  else if(a==='del'){
    var di=+el.getAttribute('data-i');
    if(S.confirmDel===di){(S.log.del=S.log.del||[]).push(sKey(S.log.sessions[di]));S.log.sessions.splice(di,1);S.confirmDel=null;scheduleSave();render();live('Økten er slettet');}
    else{S.confirmDel=di;render();live('Trykk igjen for å slette');}
  }
  else if(a==='adj'&&r){
    var k=el.getAttribute('data-k'),d=parseFloat(el.getAttribute('data-d'));
    r.cur[k]=Math.max(0,Math.round(((r.cur[k]||0)+d)*10)/10);
    var inp=$('#in-'+k);if(inp)inp.value=r.cur[k];
  }
});
document.addEventListener('change',function(ev){
  var el=ev.target;
  if(el.id==='man-type'){S.manType=el.value;S.manMin=null;var m=$('#man-min');if(m)m.value=DEFMIN[el.value];}
  else if(el.id==='man-min'){S.manMin=el.value;}
  else if(el.id==='man-date'){S.manDate=el.value;}
});
document.addEventListener('input',function(ev){
  var el=ev.target;if(!el.getAttribute||!el.getAttribute('data-k')||!S.run||!S.run.cur)return;
  var v=parseFloat(String(el.value).replace(',','.'));if(!isNaN(v))S.run.cur[el.getAttribute('data-k')]=v;
});

render();
initStore();
})();
</script>
